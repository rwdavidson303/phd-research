name: Update Articles Feed

on:
  schedule:
    - cron: '0 10 * * *'  # Daily at 10:00 UTC (4:00 AM Denver)
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write           # Needed to push commits

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Search for new articles
        run: python automation/update_articles_cloud.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/articles/articles.json website/content/articles/_index.md
          git diff --staged --quiet || git commit -m "Auto-update articles feed [$(date -u +%Y-%m-%d)]"
          git push
