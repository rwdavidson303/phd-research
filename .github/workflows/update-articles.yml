name: Update Articles Feed

on:
  schedule:
    - cron: '0 10 * * *'  # Daily at 10:00 UTC (6:00 PM Malaysia)
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write           # Needed to push commits
  pages: write              # Needed to deploy to Pages
  id-token: write           # Needed for Pages deployment

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-articles:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Search for new articles
        run: python automation/update_articles_cloud.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/articles/articles.json website/content/articles/_index.md research/articles/digests/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update articles feed [$(date -u +%Y-%m-%d)]"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Hugo CLI
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        if: steps.commit.outputs.has_changes == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        if: steps.commit.outputs.has_changes == 'true'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Kuala_Lumpur
        run: |
          hugo \
            --source website \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/public

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/deploy-pages@v4
